name: Update quiz data

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab
    inputs:
      backfill:
        description: "Backfill: ignore date windows and collect everything for this year"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Run collector
        run: python collector.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
      - name: Commit data
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add questions.json approve.json
          if ! git diff --cached --quiet; then
            git commit -m "Update quiz data"
            git push
          fi
      - name: Open review issue
        if: ${{ hashFiles('review_report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Quiz review $(date +%F)" --body-file review_report.md
